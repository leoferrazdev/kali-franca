<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Kali França — um novo espaço está sendo preparado.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://kalifranca.com.br/">
    <meta property="og:title" content="Kali França">
    <meta property="og:description" content="Kali França — um novo espaço está sendo preparado.">
    <meta property="og:image" content="https://kalifranca.com.br/profile.jpg">
    <meta property="og:image:alt" content="Retrato de Kali França">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="150">
    <meta property="og:image:height" content="150">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Kali França">
    <meta name="twitter:description" content="Kali França — um novo espaço está sendo preparado.">
    <meta name="twitter:image" content="https://kalifranca.com.br/profile.jpg">
    <title>Kali França</title>
    <style>
      :root {
        color-scheme: dark;
        --background: #111111;
        --surface: #181818;
        --border: #343434;
        --text: #f5f5f5;
        --muted: #b8b8b8;
        --accent: #a78bfa;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 50% 0%, rgba(124, 58, 237, 0.18), transparent 42%),
          var(--background);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      main {
        width: min(100%, 680px);
        padding: clamp(32px, 8vw, 72px);
        border: 1px solid var(--border);
        border-radius: 24px;
        background: rgba(24, 24, 24, 0.92);
        text-align: center;
      }

      .eyebrow {
        margin: 0 0 20px;
        color: var(--accent);
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.6rem, 9vw, 5.2rem);
        letter-spacing: -0.05em;
        line-height: 0.95;
      }

      p {
        max-width: 440px;
        margin: 28px auto 0;
        color: var(--muted);
        font-size: clamp(1rem, 2vw, 1.15rem);
        line-height: 1.7;
      }

      footer {
        margin-top: 44px;
        color: #777777;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Kali França</p>
      <h1>Um novo espaço está sendo preparado.</h1>
      <p>Em breve, este endereço apresentará as próximas experiências da Kali França.</p>
      <footer>kalifranca.com.br</footer>
    </main>
  </body>
</html>
